[project]
name = "spequlator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shubhan Singh", email = "shubhan.singh312@nmims.in" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
spequlator = "spequlator:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
